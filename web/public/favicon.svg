<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SplashFootball">
  <title>SplashFootball</title>
  <defs>
    <clipPath id="ball">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
  </defs>

  <g clip-path="url(#ball)">
    <rect width="64" height="64" fill="#ffffff" />
    <g stroke="#0b0f14" stroke-width="2" stroke-linecap="round">
      <line x1="32" y1="18" x2="32" y2="3" />
      <line x1="45.31" y1="27.67" x2="59.58" y2="23.04" />
      <line x1="40.23" y1="43.33" x2="49.05" y2="55.46" />
      <line x1="23.77" y1="43.33" x2="14.95" y2="55.46" />
      <line x1="18.69" y1="27.67" x2="4.42" y2="23.04" />
    </g>
    <g fill="#0b0f14">
      <polygon points="50.87,6.03 53.63,14.53 46.4,19.78 39.17,14.53 41.93,6.03" />
      <polygon points="62.53,41.92 55.3,47.17 48.07,41.92 50.83,33.42 59.77,33.42" />
      <polygon points="32,64.1 24.77,58.85 27.53,50.35 36.47,50.35 39.23,58.85" />
      <polygon points="1.47,41.92 4.23,33.42 13.17,33.42 15.93,41.92 8.7,47.17" />
      <polygon points="13.13,6.03 22.07,6.03 24.83,14.53 17.6,19.78 10.37,14.53" />
    </g>
    <!-- Centre panel carries the initial. -->
    <polygon points="32,18 45.31,27.67 40.23,43.33 23.77,43.33 18.69,27.67" fill="#facc15" stroke="#0b0f14" stroke-width="2" stroke-linejoin="round" />
  </g>

  <circle cx="32" cy="32" r="30" fill="none" stroke="#0b0f14" stroke-width="3" />

  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
    font-size="17"
    font-weight="900"
    fill="#0b0f14"
  >S</text>
</svg>
